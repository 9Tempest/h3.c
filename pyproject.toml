[project]
name = "h3-perf-evidence"
version = "0.1.0"
description = "Portable, pinned h3.c performance and output-drift evidence tools"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.4.4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tools/perf/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["tools/perf/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
